[project]
name = "quotebench"
version = "0.1.0"
description = "QuoteBench: how often do language models fabricate or alter verbatim quotations? Plus quotecheck, a quotation checker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Maksim" }]
dependencies = [
  "anthropic>=1.13",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "pandas>=2.2",
  "pyarrow>=16",
  "matplotlib>=3.9",
  "pyyaml>=6",
  "scipy>=1.13",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quotebench = "quotebench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

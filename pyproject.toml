[project]
name = "quotebench"
version = "1.0.0"
description = "QuoteBench, a benchmark of how often language models quote public-domain texts word for word, and quotecheck, a tool that checks the quotations in a text against a given source."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Maksim" }]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
# Lower bounds: the whole test suite passes with exactly these versions (Python 3.11,
# uv --resolution lowest-direct). anthropic 2.x has not been tested with live calls.
dependencies = [
  "anthropic>=1.13,<2",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "pandas>=2.2",
  "pyarrow>=16",
  "matplotlib>=3.10",
  "pyyaml>=6",
  "scipy>=1.13",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://codebymax10.github.io/quotebench/"
Repository = "https://github.com/codebymax10/quotebench"

[project.scripts]
quotebench = "quotebench.cli:app"
quotecheck = "quotecheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotebench", "src/quotecheck"]

# quotecheck uses the benchmark's frozen scoring settings, also when installed from a wheel.
[tool.hatch.build.targets.wheel.force-include]
"config/scoring.yaml" = "quotecheck/scoring.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
